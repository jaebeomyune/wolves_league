<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/wolves_league/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="아마추어 아이스하키 리그 기록과 예측">
  <!-- viewport-fit=cover: 아이폰 하단 홈 핸들 높이(env(safe-area-inset-bottom))를 받으려면 필요 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 아이폰 홈 화면 앱: 상태바를 불투명 기본(흰 바탕)으로. black이면 최신 iOS에서 헤더가 흐리게 덮임 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ON THE ICE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ON THE ICE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFFFF">
  <style>
    /* 아이폰: 웹 페이지 자체가 밀려 스크롤되면 iOS가 화면 맨 위에 흐림 효과를 넣어서 헤더가 흐려짐.
       페이지는 고정하고 스크롤은 앱 안에서만 되게 함 */
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #FFFFFF;
    }
    /* 아이폰 홈 핸들: 웹용 Flutter는 하단 안전 영역을 모르므로, 앱을 그 높이만큼 위로 올림.
       아래 빈 칸은 html 흰 배경이 채워서 하단 메뉴와 이어져 보임. 다른 기기는 0이라 변화 없음 */
    body {
      top: env(safe-area-inset-top, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      height: auto;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
