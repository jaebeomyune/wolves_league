<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/wolves_league/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="아마추어 아이스하키 리그 기록과 예측">
  <!-- viewport-fit=cover: 아이폰 하단 홈 핸들 높이(env(safe-area-inset-bottom))를 받으려면 필요 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 아이폰 홈 화면 앱: 상태바를 불투명 기본(흰 바탕)으로. black이면 최신 iOS에서 헤더가 흐리게 덮임 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ON THE ICE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>

  <title>ON THE ICE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFFFF">
  <style>
    /* 아이폰: 웹 페이지 자체가 밀려 스크롤되면 iOS가 화면 맨 위에 흐림 효과를 넣어서 헤더가 흐려짐.
       페이지는 고정하고 스크롤은 앱 안에서만 되게 함 */
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #FFFFFF;
    }
    /* 아이폰 홈 핸들: 웹용 Flutter는 전체 화면 모드면 창 크기를 그대로 써서 하단 안전 영역을 무시함.
       그래서 앱을 #app 상자 안에 그리고, 상자를 안전 영역만큼 띄움 (flutter_bootstrap.js의 hostElement).
       아래 빈 칸은 흰 배경이라 하단 메뉴와 이어져 보임. 홈 핸들 없는 기기는 0이라 변화 없음 */
    #app {
      position: fixed;
      left: 0;
      right: 0;
      top: env(safe-area-inset-top, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
    }
    /* 첫 화면: 앱이 켜지는 동안(엔진·앱 파일 준비) 흰 화면 대신 아이콘과 문구. 앱 첫 화면이 그려지면 지움 */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F6F8FD;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      color: #404F68;
      font-size: 14px;
      letter-spacing: -0.3px;
      transition: opacity .2s;
      z-index: 10;
    }
    #splash img { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 20px; }
    #splash .spin {
      width: 18px; height: 18px; margin-bottom: 12px;
      border: 2.5px solid #DDE2EC; border-top-color: #4458EB; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="splash"><img src="icons/Icon-192.png?v=3" alt=""><div class="spin"></div>불러오는 중입니다</div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const el = document.getElementById('splash');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 250);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- 서비스워커: 열 때마다 새 버전 확인 + 엔진·글꼴 저장 (web_overrides/sw.js) -->
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
