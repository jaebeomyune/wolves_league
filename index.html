<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1b2e">
<title>울브스 대경리그</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0b1b2e;--card:#13293f;--card2:#1a3552;--line:#25476b;--tx:#eaf2fb;--sub:#8fa9c4;--acc:#ff8a2b;--ok:#37c98b;--bad:#ef5a5a;--ice:#6cc4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header small{color:var(--sub)}
main{padding:14px 14px 20px;max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#0e2238;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:10px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:19px;font-weight:400}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:2px 0 10px;color:var(--ice)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--sub);font-weight:500;font-size:12px}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
tr.us td{background:rgba(255,138,43,.12);font-weight:700}
.rk{width:26px;color:var(--sub)}
button.b,.btn{background:var(--acc);color:#1a1000;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
button.g{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
button.d{background:transparent;color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:10px 14px;font-size:14px}
button.sm{padding:6px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.mt{margin-top:10px}
input,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px}
label{display:block;color:var(--sub);font-size:12px;margin:10px 0 4px}
.m{display:flex;align-items:center;gap:8px;padding:11px 4px;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
.m .dt{width:62px;color:var(--sub);font-size:12px;line-height:1.3}
.m .tm{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px}
.m .tm span{flex:1}
.m .tm span:last-child{text-align:right}
.m .sc{min-width:58px;text-align:center;font-weight:800;font-size:17px}
.tag{font-size:11px;border-radius:6px;padding:2px 6px;background:var(--card2);color:var(--sub)}
.tag.w{background:rgba(55,201,139,.18);color:var(--ok)}.tag.l{background:rgba(239,90,90,.18);color:var(--bad)}.tag.dr{background:rgba(143,169,196,.2);color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:22px 8px;line-height:1.6}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--sub);padding:8px;border-radius:8px;font-size:13px}
.seg button.on{background:var(--acc);color:#1a1000;font-weight:700}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.big{display:flex;align-items:center;justify-content:center;gap:16px;font-size:34px;font-weight:800;margin:8px 0}
.step{display:flex;align-items:center;justify-content:center;gap:10px}
.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:20px}
.ev{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}.ev span{flex:1}
.num{display:inline-block;min-width:26px;text-align:center;color:var(--acc);font-weight:700}
body.ro .rw{display:none!important}
.st{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:4px}.st i{width:8px;height:8px;border-radius:50%;background:var(--sub);display:inline-block}.st.on i{background:var(--ok)}.st.off i{background:#e6b23a}.st.err i{background:var(--bad)}
.note{color:var(--sub);font-size:13px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;z-index:30;font-size:13px}
</style>
</head>
<body>
<header><h1>🏒 울브스 <small>대경리그</small></h1><span class="st" id="st"><i></i><span>연결 중</span></span><button class="g sm" data-a="loginBtn" id="lb" style="display:none"></button><button class="g sm" data-a="install" id="ib" style="display:none">앱 설치</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<script type="module">
const KEY='wolves_league_v1', US='울브스';
const ROSTER=[[8,'박우철'],[13,'김영규'],[21,'최왕용'],[26,'노영준'],[32,'김주창'],[33,'이현일'],[57,'김동화'],[66,'공상은'],[71,'김기호'],[77,'최영엽'],[79,'이수봉'],[83,'박성현'],[85,'장용석'],[88,'권세현'],[90,'박성기'],[93,'윤재범'],[97,'성주엽']];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- Firebase 공유 저장소 ---------- */
const FB_CONFIG={apiKey:"AIzaSyCaZ2XVZztkgnqly98ua3ul9Utoy26iD3o",authDomain:"wolves-league.firebaseapp.com",projectId:"wolves-league",storageBucket:"wolves-league.firebasestorage.app",messagingSenderId:"969420091528",appId:"1:969420091528:web:8b2335c89923170d8eaf3d"};
const TEAM_EMAIL='team@wolves-league.app';   // 팀원 공용 계정 (비밀번호 = 팀 비밀번호)
const CACHE_KEY='wolves_league_cache', ME_KEY='wolves_me';
const FBV='10.12.2';
let fb=null, ref=null, pubRef=null, user=null, authReady=false, sync='connecting', loaded=false, unsub=null, pubRoster=null, adminMode=false, draftName='', draftEmail='';

const defaults=()=>({teams:[US],players:ROSTER.map(([no,name])=>({id:uid(),no,name})),matches:[]});
const valid=s=>s&&Array.isArray(s.players)&&Array.isArray(s.matches)&&Array.isArray(s.teams);
function loadCache(){try{const s=JSON.parse(localStorage.getItem(CACHE_KEY));if(valid(s)){loaded=true;return s}}catch(e){}return defaults()}
function legacy(){try{const s=JSON.parse(localStorage.getItem(KEY));if(valid(s)&&!localStorage.getItem(KEY+'_moved'))return s}catch(e){}return null}
const getMe=()=>{try{return localStorage.getItem(ME_KEY)||''}catch(e){return''}};
let S=loadCache(), tab='standings', sub='goals', sheet=null, dip=null;
const isAdmin=()=>!!user&&user.email!==TEAM_EMAIL;
const canEdit=isAdmin;

function save(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify(S))}catch(e){}
  if(!fb||!isAdmin()){toast('관리자 로그인이 필요합니다');return}
  const err=e=>{console.error(e);toast('저장 실패: '+(e.code||'네트워크 확인'))};
  fb.setDoc(ref,JSON.parse(JSON.stringify(S))).catch(err);
  fb.setDoc(pubRef,{players:S.players.map(p=>({no:p.no,name:p.name}))}).catch(err); // 로그인 화면용 명단(이름·번호만)
}

function subscribe(F){
  if(unsub){unsub();unsub=null}
  if(!user)return;
  unsub=F.onSnapshot(ref,{includeMetadataChanges:true},snap=>{
    if(snap.exists()&&valid(snap.data()))S=snap.data();
    else if(!snap.metadata.fromCache&&!loaded)S=defaults();
    loaded=true;
    sync=snap.metadata.hasPendingWrites?'pending':snap.metadata.fromCache?'offline':'live';
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(S))}catch(e){}
    if(sheet&&document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))renderStatus();
    else render();
  },err=>{console.error(err);sync='error';loaded=true;render()});
}
async function initFirebase(){
  try{
    const base=`https://www.gstatic.com/firebasejs/${FBV}/`;
    const [A,F,U]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')]);
    const app=A.initializeApp(FB_CONFIG);
    let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){db=F.getFirestore(app)}
    const auth=U.getAuth(app);
    fb={setDoc:F.setDoc,auth,signIn:U.signInWithEmailAndPassword,signOut:U.signOut};
    ref=F.doc(db,'league','main');pubRef=F.doc(db,'public','roster');
    F.onSnapshot(pubRef,snap=>{const d=snap.exists()&&snap.data();if(d&&Array.isArray(d.players)&&d.players.length){pubRoster=d.players;if(!user)render()}},()=>{});
    U.onAuthStateChanged(auth,u=>{user=u;authReady=true;if(!u){sync='connecting'}subscribe(F);render()});
  }catch(e){console.error(e);sync='error';authReady=true;render()}
}
function renderStatus(){
  const m={connecting:['','연결 중'],live:['on','실시간'],pending:['off','저장 중'],offline:['off','오프라인'],error:['err','연결 오류']}[sync];
  const st=document.getElementById('st');st.className='st '+m[0];st.lastChild.textContent=m[1];st.style.display=user?'':'none';
  const lb=document.getElementById('lb');lb.style.display=user?'':'none';
  lb.textContent=isAdmin()?'✏️ 관리자':(getMe()||'팀원');lb.className=isAdmin()?'b sm':'g sm';
  document.body.classList.toggle('ro',!canEdit());
}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}

const P=id=>S.players.find(p=>p.id===id);
const pn=id=>{const p=P(id);return p?`#${p.no} ${p.name}`:'(삭제된 선수)'};
function score(m){
  const n=(m.ev||[]).length;
  if(m.home===US)return{h:n,a:m.opp||0};
  if(m.away===US)return{h:m.opp||0,a:n};
  return{h:m.hs||0,a:m.as||0};
}
const fd=d=>{if(!d)return'';const t=new Date(d+'T00:00:00');return `${t.getMonth()+1}/${t.getDate()}<br>(${'일월화수목금토'[t.getDay()]})`};
const fds=d=>fd(d).replace('<br>',' ');

function standings(){
  const T={};S.teams.forEach(t=>T[t]={t,g:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  S.matches.filter(m=>m.done).forEach(m=>{
    const {h,a}=score(m);const H=T[m.home],A=T[m.away];if(!H||!A)return;
    H.g++;A.g++;H.gf+=h;H.ga+=a;A.gf+=a;A.ga+=h;
    if(h>a){H.w++;A.l++;H.pts+=3}else if(h<a){A.w++;H.l++;A.pts+=3}else{H.d++;A.d++;H.pts++;A.pts++}
  });
  return Object.values(T).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.t.localeCompare(y.t));
}
function pstats(){
  const R={};S.players.forEach(p=>R[p.id]={id:p.id,g:0,a:0});
  S.matches.forEach(m=>(m.ev||[]).forEach(e=>{if(R[e.s])R[e.s].g++;if(e.a&&R[e.a])R[e.a].a++}));
  return Object.values(R);
}

/* ---------- views ---------- */
function vStandings(){
  const r=standings();
  const played=S.matches.filter(m=>m.done).length;
  return `<div class="card"><h2>팀 순위 <small style="color:var(--sub);font-weight:400">· 종료된 경기 ${played}개 기준</small></h2>
  <div style="overflow:auto"><table><tr><th class="rk">#</th><th class="l">팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득</th><th>실</th><th>차</th><th>승점</th></tr>
  ${r.map((x,i)=>`<tr class="${x.t===US?'us':''}"><td class="rk">${i+1}</td><td class="l">${esc(x.t)}</td><td>${x.g}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gf-x.ga}</td><td><b>${x.pts}</b></td></tr>`).join('')}</table></div>
  <div class="row mt"><button class="g" data-a="copyStand">📋 순위 복사 (단톡용)</button></div></div>
  ${S.teams.length<2?'<div class="card empty">설정 탭에서 대경리그 참가팀을 추가하세요.</div>':''}`;
}
function vMatches(){
  const ms=[...S.matches].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const up=ms.filter(m=>!m.done),dn=ms.filter(m=>m.done).reverse();
  const row=m=>{const s=score(m);let tg='';
    if(m.done&&(m.home===US||m.away===US)){const my=m.home===US?s.h:s.a,op=m.home===US?s.a:s.h;tg=my>op?'<span class="tag w">승</span>':my<op?'<span class="tag l">패</span>':'<span class="tag dr">무</span>'}
    return `<div class="m" data-a="openMatch" data-id="${m.id}"><div class="dt">${fd(m.date)}</div><div class="tm"><span>${esc(m.home)}</span><span class="sc">${m.done||s.h||s.a?`${s.h} : ${s.a}`:'vs'}</span><span>${esc(m.away)}</span></div>${tg||(m.done?'':'<span class="tag">예정</span>')}</div>`};
  return `<div class="row rw" style="margin-bottom:12px"><button class="b" data-a="newMatch">＋ 경기 일정 추가</button></div>
  <div class="card"><h2>예정·진행 경기</h2>${up.length?up.map(row).join(''):'<div class="empty">예정된 경기가 없습니다.</div>'}</div>
  <div class="card"><h2>종료된 경기</h2>${dn.length?dn.map(row).join(''):'<div class="empty">아직 종료된 경기가 없습니다.</div>'}</div>`;
}
function vStats(){
  const st=pstats();
  const key={goals:x=>[x.g,x.a],assists:x=>[x.a,x.g],points:x=>[x.g+x.a,x.g]}[sub];
  const arr=st.filter(x=>x.g||x.a).sort((x,y)=>{const a=key(x),b=key(y);return b[0]-a[0]||b[1]-a[1]||(P(x.id)?.no-P(y.id)?.no)});
  let rk=0,prev=null;
  return `<div class="seg">${[['goals','득점'],['assists','어시스트'],['points','공격P']].map(([k,l])=>`<button class="${sub===k?'on':''}" data-a="sub" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="card">${arr.length?`<table><tr><th class="rk">#</th><th class="l">선수</th><th>골</th><th>어시</th><th>P</th></tr>
  ${arr.map((x,i)=>{const v=key(x).join('-');if(v!==prev){rk=i+1;prev=v}return `<tr><td class="rk">${rk}</td><td class="l"><span class="num">${P(x.id).no}</span>${esc(P(x.id).name)}</td><td>${x.g}</td><td>${x.a}</td><td><b>${x.g+x.a}</b></td></tr>`}).join('')}</table>
  <div class="row mt"><button class="g" data-a="copyScorers">📋 기록 복사 (단톡용)</button></div>`:'<div class="empty">아직 기록된 골이 없습니다.<br>일정 탭에서 경기를 열어 골을 기록하세요.</div>'}</div>`;
}
function vRoster(){
  const st=Object.fromEntries(pstats().map(x=>[x.id,x]));
  const pl=[...S.players].sort((a,b)=>a.no-b.no);
  return `<div class="card"><h2>선수단 (${pl.length}명)</h2><table><tr><th>No</th><th class="l">이름</th><th>골</th><th>어시</th><th></th></tr>
  ${pl.map(p=>`<tr><td><span class="num">${p.no}</span></td><td class="l">${esc(p.name)}</td><td>${st[p.id].g}</td><td>${st[p.id].a}</td><td><button class="g sm rw" data-a="editPlayer" data-id="${p.id}">수정</button></td></tr>`).join('')}</table>
  <div class="row mt rw"><button class="b" data-a="addPlayer">＋ 선수 추가</button></div></div>`;
}
function vMore(){
  return `<div class="card"><h2>대경리그 참가팀</h2>
  ${S.teams.map(t=>`<div class="ev"><span>${esc(t)}${t===US?' <span class="tag">우리팀</span>':''}</span>${t===US?'':`<button class="d sm rw" data-a="delTeam" data-t="${esc(t)}">삭제</button>`}</div>`).join('')}
  <div class="row mt rw"><button class="b" data-a="addTeam">＋ 팀 추가</button></div></div>
  <div class="card"><h2>내 계정</h2>${isAdmin()?`<div class="note">✏️ 관리자로 로그인됨 (${esc(user.email)})<br>입력한 기록이 모든 팀원 폰에 실시간으로 반영됩니다.</div>`:`<div class="note">👤 ${esc(getMe()||'팀원')} — 보기 전용<br>기록 입력·수정은 관리자만 할 수 있습니다.</div>`}<div class="row mt"><button class="g" data-a="logout">로그아웃</button></div></div>
  ${isAdmin()&&legacy()?`<div class="card"><h2>이 폰의 이전 기록</h2><div class="note">공유 기능 이전에 이 폰에만 저장된 기록(경기 ${legacy().matches.length}개)이 있습니다. 공용 기록으로 올리면 현재 공용 기록을 덮어씁니다.</div><div class="row mt"><button class="b" data-a="migrate">공용 기록으로 올리기</button><button class="g" data-a="dropLegacy">무시</button></div></div>`:''}
  <div class="card"><h2>데이터 백업</h2><div class="note">기록은 공용 서버(Firebase)에 저장됩니다. 만일을 위해 시즌 중간중간 백업 파일을 받아두세요.</div>
  <div class="row mt"><button class="g" data-a="export">백업 받기</button><button class="g rw" data-a="import">백업 불러오기</button></div>
  <input type="file" id="file" accept=".json,application/json" style="display:none"></div>
  <div class="card rw"><h2>초기화</h2><button class="d" data-a="reset">모든 기록 삭제</button></div>`;
}

/* ---------- match sheet ---------- */
function vSheet(){
  if(!sheet)return'';
  if(sheet.type==='match'){
    const m=S.matches.find(x=>x.id===sheet.id);if(!m){sheet=null;return''}
    const s=score(m),mine=m.home===US||m.away===US,opts=(sel)=>[...S.players].sort((a,b)=>a.no-b.no).map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>#${p.no} ${esc(p.name)}</option>`).join('');
    const stepper=(k,v)=>`<div class="step"><button class="rw" data-a="step" data-k="${k}" data-d="-1">−</button><b style="min-width:30px;font-size:30px">${v}</b><button class="rw" data-a="step" data-k="${k}" data-d="1">＋</button></div>`;
    return `<div class="sheet" data-a="closeSheet"><div>
      <div class="row"><h2 style="margin:0;flex:3">${esc(m.home)} vs ${esc(m.away)}</h2><button class="g sm" data-a="closeSheet" style="flex:0 0 auto">닫기</button></div>
      <div style="color:var(--sub);font-size:13px;margin:4px 0 8px">${fds(m.date)} ${m.done?'· 경기 종료':'· 진행/예정'}</div>
      <div class="big"><span>${s.h}</span><span style="color:var(--sub)">:</span><span>${s.a}</span></div>
      ${mine?`
        <div class="card"><h2>${US} 득점 기록</h2>
        ${(m.ev||[]).length?m.ev.map((e,i)=>`<div class="ev"><span>🥅 <b>${esc(pn(e.s))}</b>${e.a?` <small style="color:var(--sub)">어시 ${esc(pn(e.a))}</small>`:''}${e.min?` <small style="color:var(--sub)">· ${esc(e.min)}'</small>`:''}</span><button class="d sm rw" data-a="delEv" data-i="${i}">삭제</button></div>`).join(''):'<div class="empty" style="padding:10px">기록된 골이 없습니다.</div>'}
        <div class="rw"><label>득점자</label><select id="gs">${opts()}</select>
        <label>어시스트 (없으면 비워두기)</label><select id="ga"><option value="">없음 / 단독</option>${opts()}</select>
        <label>시간 (분, 선택)</label><input id="gm" type="number" inputmode="numeric" min="1" max="99" placeholder="예: 12">
        <button class="b mt" style="width:100%" data-a="addEv">🥅 골 추가</button></div></div>
        <div class="card"><h2>상대팀(${esc(m.home===US?m.away:m.home)}) 득점</h2>${stepper('opp',m.opp||0)}</div>`
      :`<div class="card"><h2>${esc(m.home)} 득점</h2>${stepper('hs',m.hs||0)}<h2 class="mt">${esc(m.away)} 득점</h2>${stepper('as',m.as||0)}</div>`}
      <div class="row mt rw"><button class="${m.done?'g':'b'}" data-a="toggleDone">${m.done?'종료 취소':'✔ 경기 종료 (순위 반영)'}</button><button class="d" data-a="delMatch">경기 삭제</button></div>
    </div></div>`;
  }
  if(sheet.type==='newMatch'){
    const to=S.teams.map(t=>`<option>${esc(t)}</option>`).join('');
    return `<div class="sheet" data-a="closeSheet"><div><h2>경기 일정 추가</h2>
      <label>날짜</label><input id="nd" type="date" value="${new Date().toISOString().slice(0,10)}">
      <label>홈팀</label><select id="nh">${to}</select>
      <label>원정팀</label><select id="na">${S.teams.map((t,i)=>`<option ${i===1?'selected':''}>${esc(t)}</option>`).join('')}</select>
      <div class="row mt"><button class="g" data-a="closeSheet">취소</button><button class="b" data-a="saveMatch">저장</button></div></div></div>`;
  }
  if(sheet.type==='player'){
    const p=sheet.id?P(sheet.id):null;
    return `<div class="sheet" data-a="closeSheet"><div><h2>${p?'선수 수정':'선수 추가'}</h2>
      <label>등번호</label><input id="pn" type="number" inputmode="numeric" value="${p?p.no:''}">
      <label>이름</label><input id="pm" value="${p?esc(p.name):''}">
      <div class="row mt">${p?'<button class="d" data-a="delPlayer">삭제</button>':''}<button class="g" data-a="closeSheet">취소</button><button class="b" data-a="savePlayer">저장</button></div></div></div>`;
  }
  return '';
}

/* ---------- render ---------- */
const TABS=[['standings','🏆','순위'],['matches','📅','일정'],['stats','🥅','기록'],['roster','👥','선수단'],['more','⚙️','설정']];
function vLogin(){
  const list=(pubRoster||ROSTER.map(([no,name])=>({no,name}))).slice().sort((a,b)=>a.no-b.no);
  const me=draftName||getMe();
  return `<div style="text-align:center;padding:26px 0 14px"><div style="font-size:46px">🏒</div><div style="font-size:22px;font-weight:800;margin-top:6px">울브스 대경리그</div><div class="note">팀원 전용 기록 앱</div></div>
  <div class="card">${adminMode?`<h2>관리자 로그인</h2>
    <label>이메일</label><input id="le" type="email" autocomplete="username" inputmode="email" value="${esc(draftEmail)}">
    <label>비밀번호</label><input id="lp" type="password" autocomplete="current-password">
    <button class="b mt" style="width:100%" data-a="adminLogin">관리자 로그인</button>
    <div class="row mt"><button class="g" data-a="toggleAdmin">← 팀원 로그인으로</button></div>`
  :`<h2>팀원 로그인</h2>
    <label>이름</label><select id="ln"><option value="">이름을 선택하세요</option>${list.map(p=>`<option value="${esc(p.name)}" ${p.name===me?'selected':''}>#${p.no} ${esc(p.name)}</option>`).join('')}</select>
    <label>팀 비밀번호</label><input id="lp" type="password" autocomplete="current-password">
    <button class="b mt" style="width:100%" data-a="memberLogin">들어가기</button>
    <div style="text-align:center;margin-top:14px"><button class="g sm" data-a="toggleAdmin">관리자 로그인</button></div>`}</div>
  ${sync==='error'?'<div class="card empty">서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.</div>':''}`;
}
function render(){
  if(!user){
    document.getElementById('app').innerHTML=authReady?vLogin():'<div class="card empty">불러오는 중…</div>';
    document.getElementById('nav').innerHTML='';document.body.classList.add('ro');renderStatus();return;
  }
  const v=loaded?{standings:vStandings,matches:vMatches,stats:vStats,roster:vRoster,more:vMore}[tab]():'<div class="card empty">기록을 불러오는 중…</div>';
  document.getElementById('app').innerHTML=v+vSheet();
  renderStatus();
  document.getElementById('nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-k="${k}"><b>${i}</b>${l}</button>`).join('');
}

/* ---------- actions ---------- */
const cur=()=>S.matches.find(x=>x.id===sheet?.id);
const A={
  tab(d){tab=d.k;sheet=null;window.scrollTo(0,0)},
  sub(d){sub=d.k},
  openMatch(d){sheet={type:'match',id:d.id}},
  closeSheet(){sheet=null},
  newMatch(){if(S.teams.length<2){toast('설정에서 팀을 먼저 추가하세요');return}sheet={type:'newMatch'}},
  saveMatch(){
    const date=document.getElementById('nd').value,home=document.getElementById('nh').value,away=document.getElementById('na').value;
    if(home===away){toast('홈/원정팀이 같습니다');return}
    S.matches.push({id:uid(),date,home,away,ev:[],opp:0,hs:0,as:0,done:false});save();sheet=null;tab='matches';
  },
  addEv(){
    const m=cur(),s=document.getElementById('gs').value,a=document.getElementById('ga').value,min=document.getElementById('gm').value;
    if(a&&a===s){toast('득점자와 어시스트가 같습니다');return}
    m.ev=m.ev||[];m.ev.push({s,a:a||null,min:min||''});save();
  },
  delEv(d){cur().ev.splice(+d.i,1);save()},
  step(d){const m=cur(),k=d.k;m[k]=Math.max(0,(m[k]||0)+ +d.d);save()},
  toggleDone(){const m=cur();m.done=!m.done;save();if(m.done)toast('순위에 반영됐습니다')},
  delMatch(){if(confirm('이 경기를 삭제할까요?')){S.matches=S.matches.filter(x=>x.id!==sheet.id);save();sheet=null}},
  addPlayer(){sheet={type:'player'}},
  editPlayer(d){sheet={type:'player',id:d.id}},
  savePlayer(){
    const no=parseInt(document.getElementById('pn').value),name=document.getElementById('pm').value.trim();
    if(isNaN(no)||!name){toast('번호와 이름을 입력하세요');return}
    if(sheet.id){const p=P(sheet.id);p.no=no;p.name=name}else S.players.push({id:uid(),no,name});
    save();sheet=null;
  },
  delPlayer(){
    const used=S.matches.some(m=>(m.ev||[]).some(e=>e.s===sheet.id||e.a===sheet.id));
    if(used&&!confirm('이 선수의 득점/어시스트 기록도 남아있습니다. 그래도 삭제할까요?'))return;
    if(!used&&!confirm('선수를 삭제할까요?'))return;
    S.players=S.players.filter(p=>p.id!==sheet.id);save();sheet=null;
  },
  addTeam(){const t=(prompt('팀 이름')||'').trim();if(!t)return;if(S.teams.includes(t)){toast('이미 있는 팀입니다');return}S.teams.push(t);save()},
  delTeam(d){
    if(S.matches.some(m=>m.home===d.t||m.away===d.t)){toast('해당 팀의 경기가 있어 삭제할 수 없습니다');return}
    if(confirm(d.t+' 팀을 삭제할까요?')){S.teams=S.teams.filter(t=>t!==d.t);save()}
  },
  copyStand(){
    const t='🏒 대경리그 순위\n'+standings().map((x,i)=>`${i+1}위 ${x.t} ${x.w}승${x.d}무${x.l}패 (득실${x.gf-x.ga>=0?'+':''}${x.gf-x.ga}) 승점${x.pts}`).join('\n');
    copy(t);
  },
  copyScorers(){
    const st=pstats().filter(x=>x.g||x.a).sort((a,b)=>b.g-a.g||b.a-a.a);
    copy('🥅 울브스 기록\n'+st.map((x,i)=>`${i+1}. #${P(x.id).no} ${P(x.id).name} ${x.g}골 ${x.a}어시`).join('\n'));
  },
  export(){
    const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=`wolves-league-${new Date().toISOString().slice(0,10)}.json`;a.click();
  },
  import(){document.getElementById('file').click()},
  reset(){if(confirm('모든 팀원의 공용 기록이 삭제됩니다. 되돌릴 수 없습니다.')&&confirm('정말 삭제할까요?')){S=defaults();save()}},
  loginBtn(){tab='more';sheet=null;window.scrollTo(0,0)},
  toggleAdmin(){adminMode=!adminMode},
  memberLogin(){
    const name=document.getElementById('ln').value,pw=document.getElementById('lp').value;draftName=name;
    if(!name){toast('이름을 선택하세요');return}if(!pw){toast('팀 비밀번호를 입력하세요');return}
    doLogin(TEAM_EMAIL,pw,()=>{try{localStorage.setItem(ME_KEY,name)}catch(e){}toast(name+'님 환영합니다')});
  },
  adminLogin(){
    const em=document.getElementById('le').value.trim(),pw=document.getElementById('lp').value;draftEmail=em;
    if(!em||!pw){toast('이메일과 비밀번호를 입력하세요');return}
    if(em.toLowerCase()===TEAM_EMAIL){toast('관리자 이메일을 입력하세요');return}
    doLogin(em,pw,()=>{adminMode=false;toast('관리자로 로그인했습니다')});
  },
  logout(){if(fb&&confirm('로그아웃할까요?')){fb.signOut(fb.auth);sheet=null;tab='standings'}},
  migrate(){const s=legacy();if(s&&confirm(`이 폰의 이전 기록(경기 ${s.matches.length}개)으로 공용 기록을 덮어씁니다.`)){S=s;save();localStorage.setItem(KEY+'_moved','1');toast('공용 기록으로 올렸습니다')}},
  dropLegacy(){localStorage.setItem(KEY+'_moved','1')},
  install(){if(dip){dip.prompt();dip=null;document.getElementById('ib').style.display='none'}}
};
function doLogin(em,pw,ok){
  if(!fb){toast('서버에 연결되지 않았습니다');return}
  fb.signIn(fb.auth,em,pw).then(()=>{ok();render()})
    .catch(e=>{console.error(e);const c=e.code||'';toast(/invalid|wrong|credential|user-not-found/.test(c)?'비밀번호가 틀렸습니다':/too-many/.test(c)?'시도가 너무 많습니다. 잠시 후 다시 시도하세요':/network/.test(c)?'인터넷 연결을 확인하세요':'로그인 실패: '+(c||e.message))});
}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('복사됨 — 단톡방에 붙여넣기')).catch(()=>{prompt('복사해서 사용하세요',t)})}

const MUT=new Set(['newMatch','saveMatch','addEv','delEv','step','toggleDone','delMatch','addPlayer','editPlayer','savePlayer','delPlayer','addTeam','delTeam','import','reset','migrate']);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.classList.contains('sheet')&&e.target!==el)return;
  const f=A[el.dataset.a];if(!f)return;
  if(MUT.has(el.dataset.a)&&!canEdit()){toast('관리자만 수정할 수 있습니다');return}
  f(el.dataset);render();
});
document.addEventListener('change',e=>{
  if(e.target.id!=='file'||!e.target.files[0])return;
  const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.players||!s.matches||!s.teams)throw 0;if(confirm('공용 기록을 백업 내용으로 덮어쓸까요? 모든 팀원에게 반영됩니다.')){S=s;save();render();toast('불러오기 완료')}}catch(x){toast('올바른 백업 파일이 아닙니다')}};
  r.readAsText(e.target.files[0]);
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;document.getElementById('ib').style.display=''});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
initFirebase();
</script>
</body>
</html>
