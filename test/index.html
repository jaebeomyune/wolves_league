<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/wolves_league/test/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- 아이폰: 화면 끝까지 쓰되(상태바 투명) 상태바 영역은 아래 흰 배경이 차지하게 함 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="아마추어 아이스하키 리그 기록과 예측">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ON THE ICE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ON THE ICE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFFFF">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
    /* 앱은 상태바(노치) 아래부터 그림. 상태바 영역은 흰 웹 배경이라 iOS 흐림 효과가 앱 글자에 겹치지 않음 */
    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0; right: 0; bottom: 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
